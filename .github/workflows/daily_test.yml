name: Run Hello Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        run: python pipeline/hello.py
